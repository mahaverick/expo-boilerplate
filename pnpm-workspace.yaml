allowBuilds:
  # Its postinstall downloads the posthog-cli binary with no checksum.
  # scripts/install-posthog-cli.sh runs the same download on a build that
  # uploads source maps, then checks the binary against scripts/posthog-cli.sha256.
  '@posthog/cli': false
  # Through jest-expo. Its install script only builds from source when no
  # prebuilt binary matches the platform, and every platform here has one.
  '@parcel/watcher': false
catalog:
  vite-plus: 1.3.0
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.20'
  - '@expo/config-plugins@58.0.13'
  - '@expo/config@58.0.12'
  - '@expo/env@2.6.0'
  - '@expo/fingerprint@0.21.10'
  - '@expo/image-utils@0.12.7'
  - '@expo/inline-modules@0.2.10'
  - '@expo/local-build-cache-provider@58.0.12'
  - '@expo/metro-config@58.0.22'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - '@expo/prebuild-config@58.0.20'
  - '@expo/require-utils@58.0.6'
  - '@expo/router-server@58.0.22'
  - babel-preset-expo@58.0.25
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
  - expo-modules-autolinking@58.1.0
  - expo-modules-cli@0.5.0
  - expo-modules-core@58.1.0
  - expo-modules-jsi@58.0.23
  - expo-server@58.1.0
  - expo@58.0.24
  - expo-dev-client@58.0.19
  - expo-dev-launcher@58.0.19
  - expo-dev-menu-interface@58.0.2
  - expo-dev-menu@58.0.13
  - expo-linking@58.0.17
  - expo-router@58.0.31
  - expo-secure-store@58.0.3
  - expo-splash-screen@58.0.14
  - expo-status-bar@58.0.5
  - expo-updates@58.0.22
  - expo-web-browser@58.0.8
overrides:
  # GHSA-3g3m-2fjr-6pw4: glob 9.0.0 to 14.0.1 keeps walking the filesystem after
  # its AbortSignal times out. Via @expo/cli and @expo/fingerprint (expo).
  # Build tooling, but a production dependency to pnpm audit.
  glob@>=9.0.0 <14.0.2: ^14.0.2
  # GHSA-g3hv-75wg-m249: minimatch 7.0.0 to 11.0.0 can amplify glob parts into
  # a denial of service. Via glob and @expo/fingerprint (expo). Build tooling,
  # but a production dependency to pnpm audit.
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
peerDependencyRules:
  # vite-plus bundles its own Vite core and Vitest,
  # whose peer ranges name upstream Vite's majors.
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
    # eslint-plugin-react-native 5.0.0 peers ESLint 9 at most. Its rules run on
    # ESLint 10 through @eslint/compat's fixupPluginRules (eslint.config.js).
    eslint-plugin-react-native>eslint: '10'
