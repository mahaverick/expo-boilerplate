# Opens the workspace switcher, chooses the row ${ROW} and waits for the workspace ${WORKSPACE}.
appId: ${APP_ID}
---
- tapOn:
    id: 'workspace-switcher'
- extendedWaitUntil:
    visible: 'Your workspaces'
    timeout: 15000
- tapOn: '${ROW}'
- extendedWaitUntil:
    notVisible: 'Your workspaces'
    timeout: 15000
- runFlow: workspace-shown.yaml
