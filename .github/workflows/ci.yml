name: CI

on:
  # Every PR, whatever its base, so a stacked PR already carries the
  # required checks when GitHub retargets it to main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR runs are grouped per PR, and a newer push cancels the older run.
# Push and dispatch runs are grouped per commit, so no commit's gate is
# ever dropped.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Jobs: lint (static gate, export, audit), sync (the shared core against
  # react-boilerplate main, PRs only), and unit (four test shards) then test
  # (merges the shards' coverage, enforces the thresholds). They start in
  # parallel. Actions are pinned to commit SHAs, and Renovate keeps the pins
  # current.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-vp installs Vite+, Node and the pnpm that packageManager names.
      # run-install is off so the install below stays `--frozen-lockfile`,
      # with hooks disabled.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      # pnpm check is vp check (Oxfmt, Oxlint with type-aware rules) plus the
      # untyped leftover ESLint, zero warnings.
      - run: pnpm check
      - run: pnpm lint:docs
      # `pnpm knip` runs knip's binary: package.json has no `knip` script,
      # because expo-doctor rejects a script named like a binary.
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm expo:doctor
      # A Hermes bundle for iOS and one for Android: proves Metro resolves
      # every import from pnpm's isolated node_modules.
      - run: pnpm export
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

  # The shared core against react-boilerplate's main: every expo row of
  # shared-core.json must be react's copy, byte for byte. PRs only, so a push
  # to main is never blocked by drift in react's main. The lint job runs in
  # its own checkout, so the second checkout here never reaches lint-docs,
  # knip or vp check.
  sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mahaverick/react-boilerplate
          ref: main
          path: react-boilerplate
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      - run: pnpm sync:check
        env:
          REACT_BOILERPLATE_DIR: ${{ github.workspace }}/react-boilerplate
      # STYLESEED.md against the table generated from react's globals.css. The
      # unit shards have no react checkout, so there the test checks only
      # tailwind.config.ts against STYLESEED.md.
      - run: pnpm test tests/unit/styleseed.test.ts
        env:
          REACT_BOILERPLATE_DIR: ${{ github.workspace }}/react-boilerplate

  # The unit suite in four shards. A shard sees part of the suite, so each
  # runs with an empty coverage threshold and uploads its coverage-final.json;
  # the test job merges them and enforces the thresholds. test:coverage keeps
  # the --testNamePattern that skips the one copy-style case expo cannot run.
  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      - run: pnpm test:coverage --shard=${{ matrix.shard }}/4 --coverageThreshold='{}' --coverageReporters=json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  # The required `test` check. Jest's --shard writes partial coverage, so this
  # job downloads the four coverage-final.json files, merges them with
  # `nyc merge`, and enforces the thresholds with `nyc check-coverage`. The
  # numbers below are jest.config.ts's coverageThreshold (statements 58,
  # branches 57, functions 44, lines 57); change both together. Run locally
  # on four shards, this method gave the same 43.78% statements and 42.51%
  # lines as one full run.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every unit shard
        if: needs.unit.result != 'success'
        run: |
          echo "A unit shard failed or was cancelled; see the unit jobs."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      # GitHub's artifact service sometimes answers 503 (ServerBusy). The first
      # download may fail; the second runs only then, after a pause. If it fails
      # too, the job fails.
      - name: Download the coverage files
        id: coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: shards/
      - name: Wait before retrying the download
        if: steps.coverage.outcome == 'failure'
        run: sleep 20
      - name: Download the coverage files (retry)
        if: steps.coverage.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: shards/
      - name: Merge the shards and enforce the thresholds
        run: |
          mkdir merge
          for shard in shards/coverage-*; do cp "$shard/coverage-final.json" "merge/$(basename "$shard").json"; done
          pnpm dlx nyc@18.0.0 merge merge .nyc_output/merged.json
          pnpm dlx nyc@18.0.0 check-coverage --statements 58 --branches 57 --functions 44 --lines 57
